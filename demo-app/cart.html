<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Shop - Cart</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a href="catalog.html">Continue shopping</a>
    <button type="button" id="logout">Log out</button>
  </header>
  <main>
    <h1>Your cart</h1>
    <p id="empty" hidden>Your cart is empty.</p>
    <ul id="cart-items" class="products"></ul>
    <p id="total" data-testid="cart-total"></p>
    <button type="button" id="checkout">Checkout</button>
  </main>
  <script src="app.js"></script>
  <script>DemoShop.initCart();</script>
</body>
</html>
